[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "docsync"
version = "0.1.0"
description = "Automated Documentation Sync: generates Markdown documentation from Python source, kept in sync with code changes."
requires-python = ">=3.11"
dependencies = []

[project.scripts]
docsync = "docsync.cli:main"

[tool.setuptools.packages.find]
include = ["docsync*"]

[project.optional-dependencies]
dev = ["pytest>=7.0"]
